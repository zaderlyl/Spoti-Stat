<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Les Musiques du Marill</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body { background-color: #f0f2f5; }
    .bg-teal { background-color: #26c6da; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="bg-primary text-white text-center py-4 mb-4">
    <h1 class="fw-bold fs-2 mb-1">les musiques du Marill</h1>
    <p class="text-white-50 mb-0 small">je n'ai pas d'inspi pour le sous titre, de toute façon vous savez ce qui vas y avoir</p>
  </div>

  <div class="container pb-5">

    <!-- CHARTS -->
    <div class="row g-4 mb-4">

      <div class="col-12 col-md-6">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-primary text-white fw-semibold">
            Top 10 des Artistes
          </div>
          <div class="card-body">
            <canvas id="chartArtistes"></canvas>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-success text-white fw-semibold">
            Distribution des Genres
          </div>
          <div class="card-body d-flex align-items-center justify-content-center">
            <canvas id="chartGenres"></canvas>
          </div>
        </div>
      </div>

    </div>

    <!-- LISTE DES MORCEAUX -->
    <div class="card shadow-sm border-0">

      <div class="card-header bg-teal text-white d-flex align-items-center justify-content-between">
        <span class="fw-semibold">Liste des Morceaux</span>
        <div class="input-group input-group-sm" style="max-width: 220px;">
          <span class="input-group-text bg-white border-end-0">
            <i class="bi bi-search text-secondary"></i>
          </span>
          <input type="text" class="form-control border-start-0 rounded-end-pill" placeholder="Rechercher..." />
        </div>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3 text-secondary fw-semibold small">Titre</th>
                <th class="text-secondary fw-semibold small">Artiste</th>
                <th class="text-secondary fw-semibold small">Album</th>
                <th class="pe-3 text-secondary fw-semibold small">Action</th>
              </tr>
            </thead>
            <tbody class="small">
              <tr>
                <td class="ps-3">Titre du morceau</td>
                <td>Nom artiste</td>
                <td class="text-muted">Nom album</td>
                <td class="pe-3">
                  <button class="btn btn-primary btn-sm py-0">
                    <i class="bi bi-info-circle me-1"></i>Détails
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<div class="footer bg-dark text-white text-center py-3 mt-4">
  <p class="mb-0">&copy; 2025 J-Music Explorer - Projet Etudiant MMI.</p>
</div>
</body>

</html>
