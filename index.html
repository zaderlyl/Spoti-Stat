<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Les Musiques du Marill</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="style/style.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body x-data="app" x-init="init()">

  <!-- HEADER -->
  <div class="bg-primary text-white text-center py-4 mb-4">
    <h1 class="fw-bold fs-2 mb-1">les musiques du Marill</h1>
    <p class="text-white-50 mb-0 small">je n'ai pas d'inspi pour le sous titre, de toute façon vous savez ce qui vas y avoir</p>
  </div>

  <div class="container-xl pb-5">

    <!-- CHARTS -->
    <div class="row g-4 mb-4">
      <div class="col-12 col-md-6">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-primary text-white fw-semibold d-flex justify-content-between align-items-center">
            <span x-text="tousArtistes ? 'Tous les Artistes' : 'Top 10 des Artistes'"></span>
            <button class="btn btn-sm btn-light fw-semibold" @click="toggleArtistes()">
              <i class="bi me-1" :class="tousArtistes ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
              <span x-text="tousArtistes ? 'Réduire' : 'Voir tout'"></span>
            </button>
          </div>
          <div class="card-body">
            <canvas id="chartArtistes"></canvas>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-success text-white fw-semibold">Distribution des Genres</div>
          <div class="card-body d-flex align-items-center justify-content-center">
            <canvas id="chartGenres"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- LISTE -->
    <div class="card shadow-sm border-0">
      <!-- Titre -->
      <div class="card-header bg-teal text-white fw-semibold d-flex align-items-center gap-2">
        <i class="bi bi-music-note-list"></i>
        Liste des Morceaux
        <span class="badge bg-white text-dark ms-auto fw-normal" x-text="filtre().length + ' résultat' + (filtre().length > 1 ? 's' : '')"></span>
      </div>

      <!-- Barre de filtres -->
      <div class="px-3 py-2 border-bottom bg-light d-flex flex-wrap align-items-center gap-2">

        <!-- Recherche -->
        <div class="input-group input-group-sm flex-grow-1" style="min-width:180px;max-width:260px;">
          <span class="input-group-text bg-white"><i class="bi bi-search text-secondary"></i></span>
          <input type="text" x-model="recherche" class="form-control" placeholder="Titre, artiste, album…" />
          <button class="btn btn-outline-secondary" x-show="recherche" @click="recherche = ''" title="Effacer">
            <i class="bi bi-x"></i>
          </button>
        </div>

        <div class="vr d-none d-md-block"></div>

        <!-- Trier par -->
        <div class="d-flex align-items-center gap-1">
          <i class="bi bi-funnel text-secondary small"></i>
          <select x-model="trierPar" class="form-select form-select-sm" style="width:150px;">
            <option value="defaut">Trier par…</option>
            <option value="titre">Titre (A→Z)</option>
            <option value="artiste">Artiste</option>
            <option value="album">Album</option>
            <option value="popularite">Popularité</option>
            <option value="genre">Genre</option>
            <option value="duree">Durée</option>
          </select>
        </div>

        <!-- Ordre croissant / décroissant -->
        <button class="btn btn-sm d-flex align-items-center gap-1"
          :class="ordreAsc ? 'btn-outline-primary' : 'btn-primary text-white'"
          @click="toggleOrdre()" title="Inverser l'ordre">
          <i class="bi" :class="ordreAsc ? 'bi-sort-alpha-down' : 'bi-sort-alpha-up-alt'"></i>
          <span class="small" x-text="ordreAsc ? 'Croissant' : 'Décroissant'"></span>
        </button>

        <div class="vr d-none d-md-block"></div>

        <!-- Filtre genre -->
        <div class="d-flex align-items-center gap-1">
          <i class="bi bi-tag text-secondary small"></i>
          <select x-model="filtreGenre" class="form-select form-select-sm" style="width:170px;">
            <option value="">Tous les genres</option>
            <template x-for="g in genresDisponibles()" :key="g">
              <option :value="g" x-text="g"></option>
            </template>
          </select>
        </div>

        <!-- Reset -->
        <button class="btn btn-sm btn-outline-danger ms-auto"
          x-show="recherche || trierPar !== 'defaut' || filtreGenre"
          @click="recherche = ''; trierPar = 'defaut'; filtreGenre = ''; ordreAsc = true"
          title="Réinitialiser les filtres">
          <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
        </button>

      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3 text-secondary fw-semibold small">Titre</th>
                <th class="text-secondary fw-semibold small">Artiste</th>
                <th class="text-secondary fw-semibold small">Album</th>
                <th class="pe-3 text-secondary fw-semibold small">Action</th>
              </tr>
            </thead>
            <tbody class="small">
              <template x-if="liste.length === 0">
                <tr>
                  <td colspan="4" class="text-center text-muted py-4">
                    <div class="spinner-border spinner-border-sm me-2"></div>Chargement…
                  </td>
                </tr>
              </template>
              <template x-for="m in filtre()" :key="m.id">
                <tr>
                  <td class="ps-3" x-text="m.titre"></td>
                  <td x-text="m.artiste"></td>
                  <td class="text-muted" x-text="m.album"></td>
                  <td class="pe-3">
                    <button class="btn btn-primary btn-sm py-0" @click="ouvrirDetails(m)">
                      <i class="bi bi-info-circle me-1"></i>Détails
                    </button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ALBUMS POPULAIRES -->
    <div class="mt-4">
      <h4 class="fw-bold mb-3">Albums Populaires</h4>
      <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3">
        <template x-for="alb in albums" :key="alb.id">
          <div class="col">
            <div class="card h-100 border-0 shadow-sm">
              <img :src="alb.pochette" :alt="alb.nom"
                   class="card-img-top" style="aspect-ratio:1/1;object-fit:cover;" />
              <div class="card-body p-2">
                <p class="fw-semibold mb-0 small lh-sm" x-text="alb.nom"></p>
                <p class="text-muted mb-1" style="font-size:0.75rem;" x-text="alb.artiste"></p>
                <p class="text-muted mb-2" style="font-size:0.72rem;" x-text="new Date(alb.date).toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'})"></p>
                <div class="d-flex gap-1 flex-wrap">
                  <span class="badge bg-primary" style="font-size:0.7rem;" x-text="alb.totalTracks + ' titre' + (alb.totalTracks > 1 ? 's' : '')"></span>
                  <span class="badge bg-success" style="font-size:0.7rem;" x-text="alb.popularite + '/100'"></span>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="bg-dark text-white text-center py-3 mt-4">
    <p class="mb-0">&copy; 2025 J-Music Explorer — Projet Étudiant MMI.</p>
  </div>

  <!-- MODAL DÉTAILS -->
  <div class="modal fade" id="modalDetails" tabindex="-1" aria-labelledby="modalDetailsLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="modalDetailsLabel">Détails du morceau</h5>
          <button type="button" class="btn-close" @click="fermerDetails()"></button>
        </div>

        <template x-if="morceauSelectionne">
          <div class="modal-body">

            <div class="d-flex gap-3 mb-3">
              <!-- Pochette + infos album -->
              <div class="flex-shrink-0 text-center" style="width:140px;">
                <img :src="morceauSelectionne.pochette" :alt="morceauSelectionne.album"
                     class="rounded" style="width:140px;height:140px;object-fit:cover;" />
                <p class="fw-semibold mb-0 mt-2 small" x-text="morceauSelectionne.album"></p>
                <p class="text-muted small mb-0"
                   x-text="morceauSelectionne.albumDate + ' • ' + morceauSelectionne.albumTracks + ' titre(s)'"></p>
                <span class="badge bg-success mt-1"
                      x-text="'Popularité: ' + morceauSelectionne.popularite + '/100'"></span>
              </div>

              <!-- Infos principales -->
              <div class="flex-grow-1">
                <h5 class="fw-bold mb-2" x-text="morceauSelectionne.titre"></h5>

                <template x-if="morceauSelectionne.previewUrl">
                  <div class="mb-3">
                    <p class="text-muted small mb-1">Preview audio</p>
                    <audio controls :src="morceauSelectionne.previewUrl" class="w-100" style="height:36px;"></audio>
                  </div>
                </template>

                <p class="text-muted fw-semibold small mb-1">Informations sur le morceau</p>
                <table class="table table-sm table-borderless small mb-0">
                  <tbody>
                    <tr>
                      <td class="text-muted">Durée</td>
                      <td class="text-end">
                        <span class="badge bg-primary" x-text="formatDuree(morceauSelectionne.duree)"></span>
                      </td>
                    </tr>
                    <tr>
                      <td class="text-muted">Popularité</td>
                      <td class="text-end">
                        <div class="d-flex align-items-center gap-2 justify-content-end">
                          <div class="progress flex-grow-1" style="height:8px;min-width:80px;">
                            <div class="progress-bar bg-primary" :style="'width:' + morceauSelectionne.popularite + '%'"></div>
                          </div>
                          <span x-text="morceauSelectionne.popularite + '/100'"></span>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <td class="text-muted">Numéro de piste</td>
                      <td class="text-end" x-text="morceauSelectionne.numPiste"></td>
                    </tr>
                    <tr>
                      <td class="text-muted">Explicit</td>
                      <td class="text-end" x-text="morceauSelectionne.explicit ? 'Oui' : 'Non'"></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Artistes -->
            <p class="text-muted fw-semibold small mb-2">Artistes</p>
            <div class="d-flex flex-column gap-2 mb-3">
              <template x-for="a in morceauSelectionne.artistes" :key="a.nom">
                <div class="d-flex align-items-center gap-2">
                  <img :src="a.image || 'https://placehold.co/40x40'" :alt="a.nom"
                       class="rounded-circle" style="width:40px;height:40px;object-fit:cover;" />
                  <div>
                    <p class="mb-0 fw-semibold small" x-text="a.nom"></p>
                    <p class="mb-0 text-muted" style="font-size:0.75rem;"
                       x-text="'Popularité: ' + a.popularite + '/100  •  Followers: ' + a.followers.toLocaleString('fr-FR')"></p>
                  </div>
                </div>
              </template>
            </div>

            <!-- Genres -->
            <p class="text-muted fw-semibold small mb-1">Genres</p>
            <div class="d-flex flex-wrap gap-1">
              <template x-if="morceauSelectionne.genres.length === 0">
                <span class="badge bg-secondary">Aucun genre</span>
              </template>
              <template x-for="g in morceauSelectionne.genres" :key="g">
                <span class="badge bg-dark" x-text="g"></span>
              </template>
            </div>

          </div>
        </template>

        <div class="modal-footer">
          <template x-if="morceauSelectionne && morceauSelectionne.spotifyUrl">
            <a :href="morceauSelectionne.spotifyUrl" target="_blank" class="btn btn-success btn-sm">
              <i class="bi bi-spotify me-1"></i>Ouvrir dans Spotify
            </a>
          </template>
          <button type="button" class="btn btn-secondary btn-sm" @click="fermerDetails()">Fermer</button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="script/script.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

</body>
</html>
